# Deploys the static site (index.html at the repo root) to GitHub Pages.
# One-time setup: in the repo, go to Settings -> Pages -> "Build and
# deployment" -> Source, and select "GitHub Actions". After that this
# workflow publishes automatically on every push to main.
name: Deploy to GitHub Pages

on:
  # Publish whenever main is updated (e.g. after merging a feature branch).
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions required by the official Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer run supersede an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root; index.html becomes the site's entry page.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
